const FLAGS=[[/\bobviously\b/i,'“obviously”'],[/it'?s obvious|it’s obvious/i,'“it’s obvious”'],[/everyone knows/i,'“everyone knows”'],[/informed sources/i,'“informed sources”'],[/\bup to\b/i,'“up to”'],[/so-called/i,'“so-called”'],[/just another/i,'“just another”']];
const wc=s=>(s||'').trim()?(s||'').trim().split(/\s+/).length:0;
function debateView(){const d=SV.deb;
  const F=(id,label,rows,ph)=>`<label class="dfield"><span>${label}</span><textarea data-f="${id}" rows="${rows||2}" placeholder="${ph||''}">${esc(d[id]||'')}</textarea></label>`;
  $('#pmain').innerHTML=`<h1>${L('Debate builder','منشئ المناظرة')}</h1><p class="lede">${L('Plan a Project 1 debate case using the Lecture 9 structure. The checklist updates as you type.','خطّط لحجة مناظرة المشروع الأول وفق بنية المحاضرة التاسعة. تتحدّث القائمة أثناء الكتابة.')}</p>
  <div class="dgrid"><div class="stack">
   ${F('motion',L('Motion','الطرح'),2,L('Children should be social media influencers.','يجب أن يكون الأطفال مؤثرين على وسائل التواصل.'))}
   <label class="dfield"><span>${L('Your side','موقفك')}</span><select data-f="side"><option value="pro"${d.side!=='con'?' selected':''}>${L('Pro (for)','مؤيد')}</option><option value="con"${d.side==='con'?' selected':''}>${L('Con (against)','معارض')}</option></select></label>
   ${F('issue',L('1 · Statement of the issue (fair and clear)','1 · عرض القضية (بإنصاف ووضوح)'),2)}
   ${F('pos',L('2 · Your position (clear and brief)','2 · موقفك (واضح وموجز)'),2)}
   ${[1,2,3].map(n=>F('a'+n,L('3 · Argument '+n,'3 · الحجة '+n),2)+F('e'+n,L('Evidence for argument '+n,'دليل الحجة '+n),1)).join('')}
   ${F('reb',L('4 · Rebuttal: the strongest opposing argument and your reply','4 · الدحض: أقوى حجة مضادة وردّك عليها'),3)}
  </div><aside class="stack"><div class="card"><h3>${L('Checklist','قائمة التحقق')}</h3><div id="dchk"></div></div>
   <div class="card"><h3>${L('Outline','المخطط')}</h3><div id="dout" class="dout"></div><div class="oact" style="margin-top:12px"><button class="btn" id="dcopy">${L('Copy outline','نسخ المخطط')}</button><button class="btn alt" id="dprint">${ico('print',22)} ${L('Print','طباعة')}</button><button class="btn alt" id="dclear">${L('Clear','مسح')}</button></div></div></aside></div>`;
  $$('[data-f]').forEach(e=>{const h=()=>{SV.deb[e.dataset.f]=e.value;save();checkDeb();};e.oninput=h;e.onchange=h;});
  $('#dcopy').onclick=e=>copyText($('#dout').innerText,e.currentTarget);
  $('#dprint').onclick=()=>{try{window.print();}catch(x){}};
  $('#dclear').onclick=()=>{SV.deb={};save();debateView();};
  checkDeb();}
function checkDeb(){const d=SV.deb,all=['motion','issue','pos','a1','e1','a2','e2','a3','e3','reb'].map(k=>d[k]||'').join(' ');
  const args=[1,2,3].filter(n=>(d['a'+n]||'').trim().length>=10),evid=args.filter(n=>(d['e'+n]||'').trim().length>=6);
  const flags=FLAGS.filter(f=>f[0].test(all)).map(f=>f[1]);
  const items=[
   [(d.issue||'').trim().length>=12,L('Issue stated as a fair, clear question','القضية معروضة بإنصاف ووضوح')],
   [(d.pos||'').trim().length>=12&&wc(d.pos)<=40,L('Position stated clearly and briefly (40 words or fewer)','الموقف واضح وموجز (40 كلمة فأقل)')],
   [args.length>=2,L('At least two supporting arguments','حجتان داعمتان على الأقل')],
   [args.length>0&&evid.length===args.length,L('Every argument has evidence','لكل حجة دليل')],
   [(d.reb||'').trim().length>=12,L('A rebuttal of the opposing side is included','تم تضمين دحض للطرف الآخر')],
   [!/in this essay/i.test((d.issue||'')+' '+(d.pos||'')),L('No trite “In this essay I shall argue…” opening','لا توجد افتتاحية مكرورة مثل «في هذا المقال سأجادل…»')],
   [flags.length===0,flags.length?L('Watch the rhetoric: ','انتبه إلى الأساليب البلاغية: ')+flags.join(', '):L('No proof surrogates or weaselers spotted','لا توجد بدائل دليل أو ألفاظ مراوغة')]];
  $('#dchk').innerHTML=items.map(i=>`<p class="dchk ${i[0]?'ok':'no'}"><span>${ico(i[0]?'check':'star',18)}</span>${i[1]}</p>`).join('')+`<p class="note" style="margin-top:8px">${items.filter(i=>i[0]).length} / ${items.length}</p>`;
  const side=d.side==='con'?L('Con','معارض'):L('Pro','مؤيد');
  const lines=[`${L('MOTION','الطرح')}: ${d.motion||'—'}`,`${L('SIDE','الموقف')}: ${side}`,'',`${L('ISSUE','القضية')}: ${d.issue||'—'}`,`${L('POSITION','الموقف المعلن')}: ${d.pos||'—'}`,''].concat([1,2,3].filter(n=>(d['a'+n]||d['e'+n])).map(n=>`${L('ARGUMENT','الحجة')} ${n}: ${d['a'+n]||'—'}\n${L('Evidence','الدليل')}: ${d['e'+n]||'—'}`),['',`${L('REBUTTAL','الدحض')}: ${d.reb||'—'}`]);
  $('#dout').innerHTML=lines.map(x=>x===''?'<br>':`<p>${esc(x).replace(/\n/g,'<br>')}</p>`).join('');}
function copyText(txt,btn){const done=()=>{const o=btn.textContent;btn.textContent=L('Copied','تم النسخ');setTimeout(()=>btn.textContent=L('Copy outline','نسخ المخطط'),1600);};
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fb);}else fb();}

function wireAct(el){if(!el)return;const key=el.dataset.key,a=ACT[key];

function drawQ(){

    const rows=g.items.map((it,i)=>[it,i+1]).filter(([it])=>(qs.tag==='All'||it[0]===qs.tag)&&(!term||(it[1]+' '+it[2]).toLowerCase().includes(term)));
    if(!rows.length)return '';shown+=rows.length;
    return `<section class="qgroup"><h2>${gtQ(g)}<small>${rows.length} ${L('of','من')} ${g.items.length}</small></h2>${rows.map(([it,n])=>`<div class="q${qs.all?' open':''}"><button class="qh" aria-expanded="${qs.all}"><span class="qno">${n}</span><span class="qt"><span class="tag">${tagLabel(it[0])}</span>${it[1]}</span><span>${ico('eye',26).replace('class="ico"','class="ico eye-on"')}${ico('eyeoff',26).replace('class="ico"','class="ico eye-off"')}</span></button><div class="qa">${it[2]}</div></div>`).join('')}</section>`;}).join('');
  const box=$('#qlist');box.innerHTML=html||`<div class="empty">${L('No questions match. Clear the search or choose another filter.','لا توجد أسئلة مطابقة. امسح البحث أو اختر مرشّحاً آخر.')}</div>`;
  $$('.q .qh',box).forEach(b=>b.onclick=()=>{const q=b.parentElement,o=q.classList.toggle('open');b.setAttribute('aria-expanded',String(o));});}

/* ---- word bank ---- */
const ws={g:'all',lang:'both',q:'',defs:true};
function viewW(){
  const total=WB.reduce((n,g)=>n+g.items.length,0);
  const lecs=[['all',L('All lectures','كل المحاضرات'),total]].concat(WB.map(g=>[g.id,UI==='ar'?GAR.w[g.id]:short(g.title),g.items.length]));
  app.innerHTML=`<div class="bankwrap">${sideHTML(`<label class="find">${ico('search',22)}<input id="wsearch" type="search" placeholder="${L('Search in English or Arabic','ابحث بالإنجليزية أو العربية')}" aria-label="${L('Search terms','ابحث في المفردات')}" value="${esc(ws.q)}"></label>
  <div class="seg" role="group" aria-label="${L('Language','اللغة')}">${[['en','English'],['ar','العربية'],['both',L('Both','كلاهما')]].map(l=>`<button data-l="${l[0]}" aria-pressed="${ws.lang===l[0]}">${l[1]}</button>`).join('')}</div>
  <span class="tog"><button class="switch sm" role="switch" aria-checked="${ws.defs}" id="wdefs" aria-label="${L('Definitions','التعريفات')}"><i></i></button>${L('Definitions','التعريفات')}</span>
  <p class="fh">${L('Lecture','المحاضرة')}</p><div class="fl" id="wg">${lecs.map(c=>`<button class="fb" data-g="${c[0]}" aria-pressed="${ws.g===c[0]}"><span>${c[1]}</span><b>${c[2]}</b></button>`).join('')}</div>
  <button class="reset" id="wprint">${ico('print',20)} ${L('Print / save as PDF','طباعة / حفظ PDF')}</button>`)}
  <section class="fmain bank"><h1>${L('Word Bank','بنك المفردات')}</h1><p class="lede">${total} ${L('key terms with meanings in English and Arabic. Switch the language or hide definitions to test yourself.','مصطلحاً أساسياً بمعانيها بالإنجليزية والعربية. بدّل اللغة أو أخفِ التعريفات لاختبار نفسك.')}</p><div id="wlist"></div></section></div>`;
  wireToggle();
  $$('#wg .fb').forEach(b=>b.onclick=()=>{ws.g=b.dataset.g;$$('#wg .fb').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));drawW();});
  $$('.seg button').forEach(b=>b.onclick=()=>{ws.lang=b.dataset.l;$$('.seg button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));drawW();});
  $('#wsearch').oninput=e=>{ws.q=e.target.value;drawW();};
  $('#wdefs').onclick=e=>{ws.defs=!ws.defs;e.currentTarget.setAttribute('aria-checked',String(ws.defs));drawW();};
  $('#wprint').onclick=()=>{try{window.print();}catch(e){}};
  drawW();}
function drawW(){
  const term=ws.q.trim().toLowerCase();
  const html=WB.filter(g=>ws.g==='all'||g.id===ws.g).map(g=>{
    const rows=g.items.filter(it=>!term||it.join(' ').toLowerCase().includes(term));if(!rows.length)return '';
    return `<section class="qgroup"><h2>${gtW(g)}<small>${rows.length} ${L('terms','مصطلحاً')}</small></h2><div class="wgrid">${rows.map(it=>{
      const en=`<div class="t">${it[0]}</div>`,ar=`<div class="t" dir="rtl" lang="ar" style="text-align:right">${it[1]}</div>`,
      ar2=`<div class="t2" dir="rtl" lang="ar" style="text-align:right">${it[1]}</div>`,
      dE=ws.defs?`<p class="d">${it[2]}</p>`:'',dA=ws.defs?`<p class="d" dir="rtl" lang="ar" style="text-align:right">${it[3]}</p>`:'';
      return `<article class="w">${ws.lang==='en'?en+dE:ws.lang==='ar'?ar+dA:en+ar2+dE+dA}</article>`;}).join('')}</div></section>`;}).join('');
  $('#wlist').innerHTML=html||`<div class="empty">${L('No terms match. Clear the search or choose another lecture.','لا توجد مصطلحات مطابقة. امسح البحث أو اختر محاضرة أخرى.')}</div>`;}

/* ---- global controls ---- */
function applyTheme(){if(SV.theme)document.documentElement.dataset.theme=SV.theme;}
function applyUI(){const h=document.documentElement;h.classList.toggle('proj',!!SV.proj);h.classList.toggle('ui-ar',UI==='ar');
  $('#btnLang').textContent=UI==='ar'?'EN':'ع';$('#btnLang').setAttribute('aria-label',L('Switch interface language to Arabic','تبديل لغة الواجهة إلى الإنجليزية'));
  $('#btnProj').setAttribute('aria-pressed',String(!!SV.proj));$('#btnProj').title=L('Projector mode','وضع العرض');
  $('#btnTheme').title=L('Light / dark','فاتح / داكن');$('#btnFull').title=L('Full screen','ملء الشاشة');}
$('#btnTheme').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';SV.theme=r.dataset.theme;save();};
$('#btnFull').onclick=()=>{try{const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{});}catch(e){}};
$('#btnProj').onclick=()=>{SV.proj=!SV.proj;save();applyUI();hh();};
$('#btnLang').onclick=()=>{UI=UI==='ar'?'en':'ar';SV.ui=UI;save();applyUI();stopTim();render();};
document.addEventListener('keydown',e=>{const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'))return;
  if(mode==='slides'){if(e.key==='ArrowRight'){go(1);}else if(e.key==='ArrowLeft'){go(-1);}}
  if(mode==='prac'&&PR.tool==='cards'&&FC.list.length){if(e.key==='ArrowRight'){$('#fnext').click();}else if(e.key==='ArrowLeft'){$('#fprev').click();}else if(e.key==='f'||e.key==='F'){$('#flash').click();}}
  if(e.key==='p'||e.key==='P'){if(!e.ctrlKey&&!e.metaKey){$('#btnProj').click();}}});
const hh=()=>document.documentElement.style.setProperty('--hh',$('.top').offsetHeight+'px');
window.addEventListener('resize',hh);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(hh);
applyTheme();applyUI();hh();
render();
})();
</script>
</body>
