<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENGL 470 · Discussion and Debate — Interactive Course</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Cairo:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#F8F9FB;--surface:#FFFFFF;--ink:#0A0A0A;--mute:#3B4457;--soft:#E9ECF2;
  --slab:#0B1F3F;--slab-ink:#F8F9FB;--maroon:#6A1226;--on-maroon:#FFFFFF;--accent:#6A1226;
  --border:#0A0A0A;--shadow:#0B1F3F;--navy:#0B1F3F;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08122A;--surface:#0E1D3B;--ink:#F4F6FA;--mute:#B7C0D3;--soft:#16274A;
    --slab:#1B3A70;--slab-ink:#FFFFFF;--maroon:#8F2238;--on-maroon:#FFFFFF;--accent:#F0A3B2;
    --border:#F4F6FA;--shadow:#8F2238;--navy:#1B3A70;
  }
}
:root[data-theme="dark"]{
  --bg:#08122A;--surface:#0E1D3B;--ink:#F4F6FA;--mute:#B7C0D3;--soft:#16274A;
  --slab:#1B3A70;--slab-ink:#FFFFFF;--maroon:#8F2238;--on-maroon:#FFFFFF;--accent:#F0A3B2;
  --border:#F4F6FA;--shadow:#8F2238;--navy:#1B3A70;
}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--hh,90px))}
body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:clamp(18px,1.45vw,23px);line-height:1.45;min-height:100vh}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.ico{flex:none;display:inline-block;vertical-align:middle}
[dir="rtl"],.ar{font-family:'Cairo','Archivo',system-ui,sans-serif}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px clamp(12px,2vw,28px);background:var(--bg);border-bottom:5px solid var(--border)}
.brand{display:flex;align-items:center;gap:14px;font-weight:900;font-size:1.5em;letter-spacing:-.02em;line-height:1}
.brand .mark{width:46px;height:46px;background:var(--slab);color:var(--slab-ink);display:grid;place-items:center;border:3px solid var(--border);box-shadow:5px 5px 0 var(--maroon)}
.brand small{display:block;font-size:.5em;font-weight:600;letter-spacing:0;color:var(--mute);margin-top:4px}
.modes{display:flex;gap:10px;flex-wrap:wrap}
.mode{display:flex;align-items:center;gap:8px;padding:9px 13px;border:3px solid var(--border);font-weight:800;font-size:.95em;background:var(--surface)}
.mode[aria-selected="true"]{background:var(--slab);color:var(--slab-ink);box-shadow:5px 5px 0 var(--maroon)}
.tools{margin-left:auto;display:flex;gap:10px;align-items:center}
.ib{width:48px;height:48px;display:grid;place-items:center;border:3px solid var(--border);background:var(--surface)}
.ib:hover{background:var(--maroon);color:var(--on-maroon)}
.ib[aria-pressed="true"]{background:var(--maroon);color:var(--on-maroon)}
.ib .sun{display:none}
:root[data-theme="dark"] .ib .sun{display:block}
:root[data-theme="dark"] .ib .moon{display:none}

/* ---------- lectures layout ---------- */
.lec{display:grid;grid-template-columns:minmax(250px,320px) minmax(0,1fr);min-height:calc(100vh - var(--hh,92px))}
.side{border-right:5px solid var(--border);padding:18px 14px 40px;display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,86px));align-self:start;max-height:calc(100vh - var(--hh,92px) - 8px);overflow:auto}
.li{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;padding:10px 12px;border:3px solid transparent;font-weight:800;line-height:1.15}
.li .n{font-size:1.9em;font-weight:900;color:var(--accent);text-align:center;letter-spacing:-.03em}
.li small{display:block;font-weight:600;color:var(--mute);font-size:.72em;margin-top:3px}
.li:hover{border-color:var(--border)}
.li[aria-current="true"]{background:var(--slab);color:var(--slab-ink);border-color:var(--border);box-shadow:6px 6px 0 var(--maroon)}
.li[aria-current="true"] .n{color:var(--slab-ink)}
.li[aria-current="true"] small{color:var(--slab-ink);opacity:.8}
.stage{padding:clamp(18px,3.5vw,56px);min-width:0}
.slidehead{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.kick{font-weight:800;color:var(--accent);font-size:.9em}
.slidehead h2{font-size:clamp(2.1rem,4.6vw,4.2rem);line-height:.98;font-weight:900;letter-spacing:-.03em;flex-basis:100%}
.slide{animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.nav{display:flex;align-items:center;gap:18px;margin-top:38px;flex-wrap:wrap;position:sticky;bottom:env(safe-area-inset-bottom,0px);z-index:6;background:var(--bg);padding:12px 0;border-top:4px solid var(--border)}
.nb{width:64px;height:64px;display:grid;place-items:center;border:3px solid var(--border);background:var(--surface);box-shadow:5px 5px 0 var(--slab)}
.nb:hover:not(:disabled){background:var(--maroon);color:var(--on-maroon)}
.nb:disabled{opacity:.3;cursor:default;box-shadow:none}
.dots{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.dot{width:26px;height:14px;border:3px solid var(--border);background:var(--surface)}
.dot.seen{background:var(--soft)}
.dot.on{background:var(--maroon);width:52px}
.count{font-weight:900;font-size:1.1em}

/* ---------- content blocks ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:clamp(18px,3vw,48px);align-items:center;margin-bottom:26px}
.bignum{font-size:clamp(7rem,20vw,17rem);line-height:.8;font-weight:900;color:var(--maroon);letter-spacing:-.06em}
:root[data-theme="dark"] .bignum{color:var(--accent)}
.hero h1{font-size:clamp(2.6rem,6.4vw,6rem);line-height:.95;font-weight:900;letter-spacing:-.04em}
.sub{font-size:1.25em;color:var(--mute);margin-top:14px;font-weight:600;max-width:34ch}
.slab{background:var(--slab);color:var(--slab-ink);border:3px solid var(--border);padding:1em 1.3em}
.objs{list-style:none;padding:1.1em 1.4em;display:grid;gap:.6em;font-weight:700;font-size:1.15em}
.objs li{display:flex;gap:14px;align-items:flex-start}
.objs li::before{content:"";width:14px;height:14px;background:var(--on-maroon);border:3px solid var(--maroon);margin-top:.5em;flex:none;background:#fff;box-shadow:3px 3px 0 var(--maroon)}
.lead{font-size:1.45em;font-weight:700;line-height:1.3;max-width:34ch}
.lead.wide{max-width:none}
.big{font-size:clamp(3rem,8vw,7rem);font-weight:900;line-height:.9;letter-spacing:-.04em}
.card{border:3px solid var(--border);background:var(--surface);padding:1em 1.2em}
.card h3,.slab h3{font-size:1.25em;font-weight:900;line-height:1.1;margin-bottom:.35em}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.stack{display:grid;gap:20px}
.note{color:var(--mute);font-weight:600;font-size:.9em}
.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border:3px solid var(--border);background:var(--maroon);color:var(--on-maroon);font-weight:800;box-shadow:5px 5px 0 var(--slab)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--slab)}
mark{background:var(--maroon);color:var(--on-maroon);padding:0 .3em}
.tag{display:inline-block;padding:2px 10px;border:3px solid var(--border);font-weight:800;font-size:.75em;background:var(--soft)}

/* switch */
.switch{width:92px;height:48px;border:3px solid var(--border);background:var(--soft);position:relative;flex:none}
.switch i{position:absolute;top:3px;left:3px;width:36px;height:36px;background:var(--slab);border:3px solid var(--border);transition:transform .22s}
.switch[aria-checked="true"]{background:var(--maroon)}
.switch[aria-checked="true"] i{transform:translateX(44px);background:#fff}
.switch.sm{width:68px;height:38px}
.switch.sm i{width:26px;height:26px}
.switch.sm[aria-checked="true"] i{transform:translateX(30px)}

/* compare */
.swbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.swl{font-size:clamp(1.5rem,3vw,2.5rem);font-weight:900;letter-spacing:-.03em;color:var(--mute);border-bottom:6px solid transparent;line-height:1.1}
.swl.on{color:var(--ink);border-color:var(--maroon)}
.cmp .rows{display:grid;gap:0;border:3px solid var(--border);background:var(--surface)}
.cmp .row{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:18px;padding:14px 18px;align-items:baseline;border-top:3px solid var(--border)}
.cmp .row:first-child{border-top:0}
.cmp .row b{font-weight:900}
.cmp .row p{font-weight:700;font-size:1.05em}
.gauges{margin-top:22px;display:grid;gap:12px}
.gauges h3{font-size:1.1em;font-weight:900}
.g{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:18px;align-items:center;font-weight:800}
.gauge{height:30px;border:3px solid var(--border);background:var(--soft)}
.gauge i{display:block;height:100%;background:var(--slab);transition:width .55s cubic-bezier(.3,.9,.3,1)}
.cmp[data-state="b"] .gauge i{background:var(--maroon)}

/* flip cards */
.fchead{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-weight:800}
.fc{display:flex;flex-direction:column;gap:.5em;border:3px solid var(--border);background:var(--surface);padding:1em 1.1em;min-height:110px;align-items:stretch;transition:background .2s}
.fc:hover{box-shadow:5px 5px 0 var(--maroon)}
.fct{display:flex;justify-content:space-between;gap:12px;font-weight:900;font-size:1.15em;line-height:1.15}
.fcd{display:none;font-weight:600}
.fc .eye-off{display:none}
.fc.open{background:var(--slab);color:var(--slab-ink)}
.fc.open .fcd{display:block}
.fc.open .eye-on{display:none}
.fc.open .eye-off{display:inline-block}

/* tabs / stepper */
.tablist{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.tab{padding:10px 18px;border:3px solid var(--border);font-weight:800;background:var(--surface)}
.tab.on{background:var(--slab);color:var(--slab-ink);box-shadow:5px 5px 0 var(--maroon)}
.panel{display:none}
.panel.on{display:block;animation:in .25s ease-out}
.stepper{counter-reset:s}
.stepper .tab{counter-increment:s;display:flex;gap:10px;align-items:center}
.stepper .tab::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;background:var(--maroon);color:var(--on-maroon);font-weight:900;border:3px solid var(--border)}
.stepper .tab.on::before{background:#fff;color:var(--ink)}
.stepper .panel h3{font-size:1.8em;font-weight:900;line-height:1.05;margin-bottom:.4em}

/* checklist */
.ck{display:flex;gap:14px;align-items:flex-start;padding:10px 14px;border:3px solid var(--border);background:var(--surface);font-weight:700;width:100%}
.ck .box{width:34px;height:34px;border:3px solid var(--border);display:grid;place-items:center;flex:none;color:transparent;background:var(--bg)}
.ck[aria-checked="true"]{background:var(--slab);color:var(--slab-ink)}
.ck[aria-checked="true"] .box{background:var(--maroon);color:#fff}
.meter{height:26px;border:3px solid var(--border);background:var(--soft);margin:8px 0 18px}
.meter i{display:block;height:100%;background:var(--maroon);transition:width .4s}

/* vs panels */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
.vs .side2{padding:1em 1.3em;border:3px solid var(--border);font-weight:700}
.vs .pro{background:var(--slab);color:var(--slab-ink)}
.vs .con{background:var(--maroon);color:var(--on-maroon)}
.vs h3{font-size:clamp(2rem,4vw,3.4rem);font-weight:900;line-height:1;letter-spacing:-.03em}
.quote{font-size:1.35em;font-weight:800;line-height:1.3;border-left:10px solid var(--maroon);padding-left:18px}

/* quiz */
.quiz{max-width:900px}
.qprog{height:16px;border:3px solid var(--border);background:var(--soft);margin-bottom:12px}
.qprog i{display:block;height:100%;background:var(--maroon)}
.qn{font-weight:800;color:var(--mute)}
.qtext{font-size:1.5em;font-weight:800;line-height:1.25;margin:10px 0 18px}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.opt{padding:14px 18px;border:3px solid var(--border);font-weight:900;font-size:1.1em;background:var(--surface);text-align:center}
.opt:hover:not(:disabled){background:var(--soft);box-shadow:5px 5px 0 var(--maroon)}
.opt.right{background:var(--slab);color:var(--slab-ink)}
.opt.wrong{background:var(--maroon);color:var(--on-maroon)}
.opt:disabled{cursor:default}
.why{margin:18px 0;padding:14px 18px;border:3px solid var(--border);background:var(--surface);font-weight:600}
.next{margin-top:6px}
.qres{text-align:center;padding:2em}

/* sliders */
.range{width:100%;accent-color:var(--maroon);height:34px}
.slrow{display:grid;gap:4px;margin-bottom:16px}
.slrow label{font-weight:900}
.slrow .ends{display:flex;justify-content:space-between;font-weight:700;font-size:.8em;color:var(--mute)}
.verdict{padding:1em 1.3em;border:3px solid var(--border);font-weight:900;font-size:1.3em;background:var(--surface)}
.mtr{position:relative;height:34px;border:3px solid var(--border);background:linear-gradient(90deg,var(--maroon) 0 33%,var(--soft) 33% 66%,var(--slab) 66%);margin:12px 0}
.mtr b{position:absolute;top:-10px;width:10px;height:50px;background:var(--ink);border:2px solid var(--bg);transition:left .35s}

/* device explorer */
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chip{padding:8px 16px;border:3px solid var(--border);font-weight:800;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--maroon);color:var(--on-maroon);box-shadow:4px 4px 0 var(--slab)}
.ex{font-weight:600;font-style:italic;margin-top:.4em}

/* timeline / weeks */
.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
.wk{padding:10px 6px;border:3px solid var(--border);font-weight:900;text-align:center;background:var(--surface);line-height:1.1}
.wk small{display:block;font-size:.55em;font-weight:700;margin-top:4px}
.wk.k-i{background:var(--soft)}
.wk.k-c{background:var(--slab);color:var(--slab-ink)}
.wk.k-d{background:var(--maroon);color:var(--on-maroon)}
.wk.k-e{background:var(--ink);color:var(--bg)}
.wk[aria-pressed="true"]{outline:5px solid var(--accent);outline-offset:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-weight:800;font-size:.85em;margin:14px 0}
.legend span::before{content:"";display:inline-block;width:18px;height:18px;border:3px solid var(--border);margin-right:8px;vertical-align:-3px;background:var(--c)}

/* donut */
.donut{display:grid;grid-template-columns:minmax(240px,420px) 1fr;gap:26px;align-items:center}
.donut svg{width:100%;height:auto}
.lg{display:grid;gap:10px}
.lgi{display:flex;align-items:center;gap:14px;padding:10px 14px;border:3px solid var(--border);font-weight:800;background:var(--surface);width:100%}
.lgi i{width:22px;height:22px;border:3px solid var(--border);background:var(--c);flex:none}
.lgi b{margin-left:auto;font-size:1.3em}
.lgi[aria-pressed="true"]{background:var(--slab);color:var(--slab-ink);box-shadow:5px 5px 0 var(--maroon)}

/* balance */
.bal svg{width:100%;max-width:640px;height:auto;display:block;margin:0 auto}
.beam{transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform-origin:320px 90px}

/* ---------- banks ---------- */
.bank{padding:clamp(18px,3.5vw,56px);max-width:1500px;margin:0 auto}
.bank h1{font-size:clamp(2.6rem,6vw,5.6rem);line-height:.95;letter-spacing:-.04em;font-weight:900;margin-bottom:10px}
.bank .lede{font-size:1.25em;font-weight:600;color:var(--mute);max-width:50ch;margin-bottom:26px}
.filters{display:grid;gap:14px;margin-bottom:26px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,86px));z-index:5;background:var(--bg);padding:12px 0;border-bottom:3px solid var(--border)}
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.find{display:flex;align-items:center;gap:10px;border:3px solid var(--border);padding:8px 14px;background:var(--surface);flex:1 1 260px;min-width:0}
.find input{border:0;background:none;outline:none;width:100%;font-weight:700}
.seg{display:flex;border:3px solid var(--border);background:var(--surface)}
.seg button{padding:8px 16px;font-weight:900}
.seg button[aria-pressed="true"]{background:var(--slab);color:var(--slab-ink)}
.tog{display:flex;align-items:center;gap:10px;font-weight:800}
.qgroup{margin-bottom:44px}
.qgroup>h2{font-size:clamp(1.8rem,3.4vw,3rem);font-weight:900;letter-spacing:-.03em;line-height:1;padding:12px 18px;background:var(--slab);color:var(--slab-ink);border:3px solid var(--border);box-shadow:6px 6px 0 var(--maroon);margin-bottom:22px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.qgroup>h2 small{font-size:.4em;font-weight:800}
.q{border:3px solid var(--border);background:var(--surface);margin-bottom:14px}
.qh{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:16px 18px;width:100%}
.qno{font-size:1.6em;font-weight:900;color:var(--accent);min-width:2ch;letter-spacing:-.03em}
.qt{font-weight:800;font-size:1.15em;line-height:1.3}
.qt .tag{margin-right:10px;vertical-align:2px}
.qa{display:none;padding:16px 20px 20px;border-top:3px solid var(--border);background:var(--soft);font-weight:600;font-size:1.05em}
.q.open .qa{display:block}
.q.open .qh .eye-on{display:none}
.q .eye-off{display:none}
.q.open .eye-off{display:inline-block}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:18px}
.w{border:3px solid var(--border);background:var(--surface);padding:18px 20px;display:grid;gap:8px;align-content:start}
.w .t{font-size:1.6em;font-weight:900;letter-spacing:-.02em;line-height:1.05}
.w .t2{font-size:1.25em;font-weight:900;color:var(--accent)}
.w .d{font-weight:600;color:var(--ink)}
.w .gp{font-weight:800;font-size:.72em;color:var(--mute)}
.w[data-primary="ar"] .t{font-family:'Cairo',sans-serif;line-height:1.3}
.empty{padding:40px;border:3px dashed var(--border);font-weight:800;text-align:center}

@media (max-width:900px){
  .lec{grid-template-columns:1fr}
  .side{position:static;max-height:none;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:5px solid var(--border);padding:12px}
  .li{grid-template-columns:auto;min-width:170px}
  .li .n{text-align:left;font-size:1.5em}
  .vs{grid-template-columns:1fr}
  .cmp .row,.g{grid-template-columns:1fr;gap:4px}
  .weeks{grid-template-columns:repeat(4,1fr)}
  .donut{grid-template-columns:1fr}
  .qh{grid-template-columns:auto 1fr}
  .qh .ico{display:none}
  .tools{margin-left:0}
  .filters{position:static}
  .top{position:static;padding:10px 14px;gap:8px 12px}
  .brand{font-size:1.1em;flex:1}.brand .mark{width:36px;height:36px}
  .tools{order:2;margin-left:0}
  .modes{order:3;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mode{padding:8px 6px;font-size:.78em;gap:6px;justify-content:center}
  .mode .ico{width:20px;height:20px}
  .ib{width:42px;height:42px}
  .side{padding:8px 10px;gap:8px}
  .li{grid-template-columns:auto;min-width:0;padding:4px 14px;border-color:var(--border)}
  .li>span:nth-child(2){display:none}
  .li .n{font-size:1.35em}
  .stage{padding:14px 14px 0}
  .slidehead{margin-bottom:12px;gap:6px}
  .hero{grid-template-columns:auto 1fr;gap:12px;margin-bottom:16px}

<main id="app"></main>
<script>
(()=>{'use strict';
/* ===== saved progress + UI language ===== */
const STORE_KEY='engl470.v1';
const SV={part:{},hq:{},hw:{},theme:null,proj:false,ui:'en',deb:{}};
try{const r=localStorage.getItem(STORE_KEY);if(r){const o=JSON.parse(r);Object.keys(SV).forEach(k=>{if(o[k]!==undefined)SV[k]=o[k];});}}catch(e){}
const save=()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(SV));}catch(e){}};
let UI=SV.ui==='ar'?'ar':'en';
const L=(en,ar)=>UI==='ar'?ar:en;
const LECAR={'1':['المناقشة والمناظرة','صيغ الحديث والحوار'],'2':['أساسيات التفكير الناقد','أسس اتخاذ القرار'],'3':['نوعان من الاستدلال','الادعاءات والحجج والاستنباط والاستقراء'],'5':['التفكير الواضح والمغالطات','معوّقات التفكير الواضح'],'6':['المصداقية','الادعاء ومصدره'],'7':['تقييم الادعاء','الملاحظة والمعلومات الخلفية'],'8':['الإقناع عبر الخطابة','الأساليب والتقنيات'],'9':['الكتابة الحجاجية','التخطيط والكتابة والمراجعة'],'P1':['المشروع الأول','هل يصحّ أن يكون الأطفال مؤثرين؟']};
const GAR={
 q:{l1:'م1 · المناقشة والمناظرة',l2:'م2 · أساسيات التفكير الناقد',l3:'م3 · نوعا الاستدلال',l3p:'م3 · تدريب: الاستنباط والاستقراء',l5:'م5 · التفكير الواضح والمغالطات',l6:'م6 · المصداقية: الادعاء والمصدر',l7:'م7 · تقييم الادعاء',l8:'م8 · الإقناع عبر الخطابة',l9:'م9 · الكتابة الحجاجية',p1:'المشروع 1 · الأطفال المؤثرون'},
 w:{l1:'م1 · المناقشة والمناظرة',l2:'م2 · أساسيات التفكير الناقد',l3:'م3 · الادعاءات ونوعا الاستدلال',l5:'م5 · التفكير الواضح والمغالطات',l67:'م6–7 · المصداقية',l8:'م8 · الخطابة والإقناع',l9:'م9 · الكتابة والمشروع 1'}
};
const TAGS=[['All','All types','كل الأنواع'],['Def','Define','عرّف'],['Exp','Explain','اشرح'],['App','Apply','طبّق'],['T/F','True / False','صح / خطأ'],['Cmp','Compare','قارن']];
const tagLabel=c=>{const t=TAGS.find(x=>x[0]===c);return t?(UI==='ar'?t[2]:c):c;};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const IC={
 slides:'<path d="M3 5h18v11H3zM8 20h8M12 16v4"/>',
 quiz:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.01"/>',
 words:'<path d="M3 18l5-12 5 12M4.8 14h6.4M15 9h6M18 9c0 4-2 7-5 8M16 13c1 2 3 3.5 5 4"/>',
 left:'<path d="M15 5l-7 7 7 7"/>',right:'<path d="M9 5l7 7-7 7"/>',
 eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 eyeoff:'<path d="M3 3l18 18M10.6 5.1A9.7 9.7 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.9M6.6 6.6C3.7 8.5 2 12 2 12s4 7 10 7c1.6 0 3-.4 4.3-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
 check:'<path d="M4 12l5 5L20 6"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
 redo:'<path d="M20 8a8 8 0 1 0 1 6M20 3v5h-5"/>',
 practice:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
 timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
 shuffle:'<path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3"/>',
 star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
 print:'<path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/>'
};
const ico=(n,s=26)=>`<svg class="ico" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- widget builders (return HTML strings) ---------- */
const hero=(no,title,sub,objs)=>`<div class="hero"><div class="bignum" aria-hidden="true">${no}</div><div><h1>${title}</h1><p class="sub">${sub}</p></div></div><ul class="objs slab">${objs.map(o=>`<li>${o}</li>`).join('')}</ul>`;

const compare=(a,b,rows,gauges,gtitle)=>`<div class="cmp" data-state="a">
<div class="swbar"><button class="swl" data-side="a">${a}</button><button class="switch" role="switch" aria-checked="false" aria-label="Switch between ${esc(a)} and ${esc(b)}"><i></i></button><button class="swl" data-side="b">${b}</button></div>
<div class="rows">${rows.map(r=>`<div class="row"><b>${r[0]}</b><p data-a="${esc(r[1])}" data-b="${esc(r[2])}">${r[1]}</p></div>`).join('')}</div>
${gauges?`<div class="gauges"><h3>${gtitle||''}</h3>${gauges.map(g=>`<div class="g"><span>${g[0]}</span><div class="gauge"><i style="width:${g[1]}%" data-a="${g[1]}" data-b="${g[2]}"></i></div></div>`).join('')}</div>`:''}
</div>`;

const fcs=(items,cols)=>`<div class="fcs"><div class="fchead"><button class="switch sm" role="switch" aria-checked="false" data-revall aria-label="Reveal all cards"><i></i></button><span>${L('Reveal all','إظهار الكل')}</span></div><div class="grid ${cols||'g3'}">${items.map(([t,d])=>`<button class="fc" aria-expanded="false"><span class="fct"><span>${t}</span><span>${ico('eye',22).replace('class="ico"','class="ico eye-on"')}${ico('eyeoff',22).replace('class="ico"','class="ico eye-off"')}</span></span><span class="fcd">${d}</span></button>`).join('')}</div></div>`;

const tabs=(items,kind)=>`<div class="tabs ${kind||''}" data-tabs><div class="tablist" role="tablist">${items.map((it,i)=>`<button role="tab" class="tab${i?'':' on'}" data-i="${i}" aria-selected="${!i}">${it[0]}</button>`).join('')}</div>${items.map((it,i)=>`<div class="panel${i?'':' on'}" data-i="${i}" role="tabpanel">${it[1]}</div>`).join('')}</div>`;

const checklist=(items,label)=>`<div class="chk"><p class="note" style="font-weight:800"><span data-cn>0</span> / ${items.length} ${label}</p><div class="meter"><i style="width:0%"></i></div><div class="grid g2">${items.map(t=>`<button class="ck" role="checkbox" aria-checked="false"><span class="box">${ico('check',20)}</span><span>${t}</span></button>`).join('')}</div></div>`;

const QZ={};
const quiz=(id,items)=>{QZ[id]=items;return `<div class="quiz" data-quiz="${id}"></div>`;};

/* ---------- binders ---------- */
function wireCompare(root){$$('.cmp',root).forEach(c=>{
  const set=s=>{c.dataset.state=s;$('.switch',c).setAttribute('aria-checked',String(s==='b'));
    $$('.row p',c).forEach(p=>p.innerHTML=p.dataset[s]);
    $$('.gauge i',c).forEach(i=>i.style.width=i.dataset[s]+'%');
    $$('.swl',c).forEach(x=>x.classList.toggle('on',x.dataset.side===s));};
  $('.switch',c).onclick=()=>set(c.dataset.state==='a'?'b':'a');
  $$('.swl',c).forEach(x=>x.onclick=()=>set(x.dataset.side));set('a');});}

function wireFlip(root){$$('.fcs',root).forEach(w=>{
  const cards=$$('.fc',w),sw=$('[data-revall]',w);
  cards.forEach(c=>c.onclick=()=>{const o=c.classList.toggle('open');c.setAttribute('aria-expanded',String(o));
    sw.setAttribute('aria-checked',String(cards.every(x=>x.classList.contains('open'))));});
  sw.onclick=()=>{const on=sw.getAttribute('aria-checked')!=='true';sw.setAttribute('aria-checked',String(on));
    cards.forEach(c=>{c.classList.toggle('open',on);c.setAttribute('aria-expanded',String(on));});};});}

function wireTabs(root){$$('[data-tabs]',root).forEach(t=>{
  const tb=$$(':scope>.tablist>.tab',t),pn=$$(':scope>.panel',t);
  tb.forEach(b=>b.onclick=()=>{const i=b.dataset.i;tb.forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-selected',String(on));});
    pn.forEach(p=>p.classList.toggle('on',p.dataset.i===i));});});}

function wireChecks(root){$$('.chk',root).forEach(w=>{
  const cs=$$('.ck',w),n=$('[data-cn]',w),bar=$('.meter i',w);
  cs.forEach(c=>c.onclick=()=>{c.setAttribute('aria-checked',String(c.getAttribute('aria-checked')!=='true'));
    const k=cs.filter(x=>x.getAttribute('aria-checked')==='true').length;n.textContent=k;bar.style.width=(k/cs.length*100)+'%';});});}

function wireQuiz(el){
  const items=QZ[el.dataset.quiz];let i=0,score=0,locked=false;
  const draw=()=>{
    if(i>=items.length){el.innerHTML=`<div class="qres slab"><h3>${L('Your score','نتيجتك')}</h3><p class="big">${score} / ${items.length}</p><p style="margin:14px 0 22px;font-weight:700">${score===items.length?L('Perfect run.','أداء ممتاز.'):score>=items.length*.7?L('Strong result. Review the ones you missed.','نتيجة جيدة. راجع الأسئلة التي أخطأت فيها.'):L('Keep practising: go back to the lecture slides and try again.','واصل التدريب: ارجع إلى شرائح المحاضرة وحاول مجدداً.')}</p><button class="btn" data-r>${ico('redo',22)} ${L('Try again','أعد المحاولة')}</button></div>`;
      $('[data-r]',el).onclick=()=>{i=0;score=0;draw();};return;}
    const it=items[i];locked=false;
    el.innerHTML=`<div class="qprog"><i style="width:${i/items.length*100}%"></i></div><p class="qn">${L('Question','السؤال')} ${i+1} ${L('of','من')} ${items.length} · ${L('Score','النتيجة')} ${score}</p><p class="qtext">${it[0]}</p><div class="opts">${it[1].map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div><div class="why" hidden></div><button class="btn next" hidden>${i===items.length-1?L('See score','عرض النتيجة'):L('Next question','السؤال التالي')} ${ico('right',22)}</button>`;
    $$('.opt',el).forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const k=+b.dataset.k,ok=k===it[2];if(ok)score++;
      $$('.opt',el).forEach(o=>{const kk=+o.dataset.k;o.classList.toggle('right',kk===it[2]);if(kk===k&&!ok)o.classList.add('wrong');o.disabled=true;});
      const w=$('.why',el);w.hidden=false;w.innerHTML=`<b>${ok?L('Correct.','صحيح.'):L('Not quite.','ليست دقيقة.')}</b> ${it[3]}`;

 ['Definition','Stands to gain from our belief in a claim','Has no stake in our belief either way'],
 ['Treatment','View with much more suspicion','Trust more, though not every disinterested party has good information'],
 ['Friend’s investment tip','Loses credibility if he earns a substantial commission','Gains credibility if he invested his own money'],
 ['The neighbor’s denial','Loses credibility if he owns a silencer and an untraceable .45','Credible if you have always liked and trusted him']])),
S('Judging a person’s credibility',()=>`<p class="lead wide" style="margin-bottom:20px">Flip between what people wrongly use and what actually matters.</p>`+compare('Irrelevant cues','Relevant grounds',[
 ['Physical','Eye contact, sweating, nervous laugh, height, loudness, assertiveness','—'],
 ['Personal traits','Gender, age, ethnicity, accent, mannerisms, clothes','—'],
 ['Knowledge','—','Education, experience, accomplishments, reputation, position'],
 ['Expertise','Occupation is a weak guide to moral character or truthfulness','Claims must pertain to the expert’s field and not conflict with other experts in it']]))
]});

/* ================= LECTURE 7 ================= */
LEC.push({no:'7',name:'Assessing the Claim',sub:'Observation and background information',slides:[
S('Assessing the content of the claim',()=>hero('7','Assessing the Claim','Does it fit what we saw and what we know?',['Claims fail when they conflict with our observations or background knowledge','We give every claim an initial plausibility','The less it fits, the more suspicious we should be'])),
S('Observation vs report',()=>`<div class="grid g2" style="margin-bottom:20px"><div class="slab"><h3>You saw</h3><p class="big" style="font-size:3rem">A red Mini Cooper</p></div><div class="slab" style="background:var(--maroon)"><h3>Parker says</h3><p class="big" style="font-size:3rem">A bright blue one</p></div></div><p class="lead wide">Moore needs no critical thinking training to reject the claim: it conflicts with his own observation. Our observations are our most reliable source, so a report that conflicts with them is subject to serious doubt.</p>`),
S('What distorts observation?',()=>fcs([
 ['Conditions','Tiredness, distraction, worry, emotional upset; bad lighting, noise, fast events; inexact instruments.'],
 ['Expectations','Beliefs, hopes and fears shape what we see: rats in a “rat-infested” house, séance phenomena that do not exist, teachers rating “brighter” classes higher.'],
 ['Interests and bias','We overlook faults in people we love and exaggerate flaws in projects we want to fail.'],
 ['Memory','Observations are only as reliable as memories, and memory can deceive.']],'g2')),
S('Background information',()=>`<p class="lead wide" style="margin-bottom:20px">The large body of justified beliefs built from what we observed and what we learned from others. We may not recall where we learned it.</p><div class="grid g3"><div class="card"><h3>Initial plausibility</h3><p>A rough assessment of how credible a claim seems, based on how well it fits our background information.</p></div><div class="card"><h3>Good fit</h3><p>Some reasonable degree of initial plausibility.</p></div><div class="card"><h3>Conflict</h3><p>Low initial plausibility: lean towards rejecting it unless very strong evidence is produced.</p></div></div><p class="note" style="margin-top:14px">The broader your background information, the better you can evaluate a report: economics for deficit claims, how Social Security works to see why calling it a savings account is misleading.</p>`),
S('Plausibility meter',()=>plausibility(),root=>wirePlaus(root)),
S('Doubts about sources',()=>`<div class="grid g2" style="margin-bottom:20px"><div class="slab"><h3>Knowledge or expertise</h3><p>Judge by education, experience, accomplishments, reputation and position.</p></div><div class="slab" style="background:var(--maroon)"><h3>Veracity, objectivity, accuracy</h3><p>Is the source honest, unbiased and precise?</p></div></div><p class="lead wide">Claims lack credibility to the extent they conflict with observations, experience or background information, or come from sources that lack credibility. Expert claims are most reliable when they pertain to the expert’s field and do not conflict with other experts’.</p>`)
]});

const DEV=[
 ['Devices I','Euphemism','A neutral or positive expression in place of one with negative associations.','“Pre-owned” for “used”.'],
 ['Devices I','Dysphemism','The opposite: a word chosen to produce a negative attitude.','“Terrorist” rather than “freedom fighter”.'],
 ['Devices I','Weaseler','Hedging that waters a claim down and gives the author a way out.','“Lose up to ten pounds a week.”'],
 ['Devices I','Downplayer','Makes someone or something look less important.','“He’s just another liberal”; “so-called doctor”.'],
 ['Devices II','Stereotype','A generalization about all members of a group based on an image of them.','“Women are emotional.”'],
 ['Devices II','Innuendo','Hints using conversational assumptions, without saying it outright.','Everyone “passed” means everyone who took the exam.'],
 ['Devices II','Loaded question','A question resting on an unwarranted assumption.','“Have you stopped cheating on exams?”'],
 ['Devices III','Ridicule / sarcasm','The “horse laugh”: vicious humor used to sway opinion.','“They’re really on top of things.”'],
 ['Devices III','Hyperbole','Extravagant overstatement.','“I’m so hungry I could eat all the food here.”'],
 ['Devices IV','Rhetorical definition / explanation','A definition or explanation slanted to persuade.','Defining a term so it carries a verdict.'],
 ['Devices IV','Rhetorical analogy / misleading comparison','An analogy or comparison used to slant a point.','A comparison that distorts the facts.'],
 ['Proof & repetition','Proof surrogate','Suggests evidence or authority without citing it.','“Informed sources say…”, “It’s obvious that…”.'],
 ['Proof & repetition','Repetition','Making the same point again and again until it feels believable.','A claim unlikely on first hearing is no more likely on the hundredth.'],
 ['Visuals','Visual persuasion','Photos, illustrations and graphics that amplify a message; power depends on content, style and relation to copy.','Visuals and copy must form one message.']];

S('Rhetoric is not argument',()=>`<p class="lead wide" style="margin-bottom:20px">Same debt, two ways of saying it.</p>`+compare('“Still owes over $1,000”','“Owes only a little over $1,000”',[

 ['Calling a used car “pre-owned”.',['Euphemism','Dysphemism','Downplayer','Repetition'],0,'A positive expression replacing one with negative associations.'],

LEC.push({no:'9',name:'Argumentative Writing',sub:'Plan, write, revise',slides:[
S('Argumentative writing',()=>hero('9','Argumentative Writing','Taking a stance and supporting it with evidence.',['An argumentative essay takes a stance on an issue and persuades the reader','It rests on thorough research and analysis of relevant sources','It needs focus, sequence and completeness'])),
S('Four components',()=>fcs([['1 · Statement of the issue','Show the issue is important or interesting, and state it fairly, not so your position looks like the only correct one.'],['2 · Statement of your position','Clear and brief. If the issue is stated clearly, the position is easy to identify.'],['3 · Arguments in support','Succinct, but clarity matters more than brevity. Reasons must be relevant and reliable, or backed by further arguments.'],['4 · Rebuttals of contrary arguments','Answer anticipated objections to your position.']],'g2')),
S('Four planning hints',()=>tabs([['Focus','<div class="card"><h3>Focus</h3><p>State the issue and your position at the outset in an engaging way, and avoid the trite “In this essay I shall argue…” and its closing echo.</p></div>'],['Stick to the issue','<div class="card"><h3>Stick to the issue</h3><p>Every point must support, illustrate, explain, clarify, elaborate or emphasize your position, or respond to an anticipated objection.</p></div>'],['Logical sequence','<div class="card"><h3>Logical sequence</h3><p>Make a point before you clarify it. A reader should be able to outline your essay with ease.</p></div>'],['Be complete','<div class="card"><h3>Be complete</h3><p>Support your position, answer objections, define the issue sharply, and close every sentence, paragraph and the essay. A conclusion is not a summary; short essays need no summary.</p></div>']],'stepper')),
S('Good writing practices',()=>checklist(['After the first draft, identify the issue and your position and state both first.','Revise: think in terms of innumerable drafts.','Have someone else read the essay and criticize it.','Read it aloud to catch grammar and punctuation problems.','When satisfied, put it aside and revise again later.'],'practices done')),
S('Essay types to avoid',()=>fcs([['The Windy Preamble','Long introductory remarks that avoid the issue.'],['The Stream-of-Consciousness Ramble','Thoughts spilled out in the order they arrive.'],['The Knee-Jerk Reaction','A first reaction with no depth or detail.'],['The Glancing Blow','Addresses the issue only obliquely, e.g. history of cycling instead of its health benefits.'],['Let the Reader Do the Work','Non sequiturs, abrupt shifts and irrelevant sidetracks.']])),
S('Writing in a diverse society',()=>`<p class="lead wide" style="margin-bottom:20px">Avoid reinforcing questionable assumptions about gender, ethnic background, religion, ability or other characteristics.</p><div class="grid g3"><div class="card"><h3>Clarity</h3><p>Careless word choices are imprecise and inaccurate.</p></div><div class="card"><h3>Credibility</h3><p>Biased wording, even unintended, can diminish the writer’s credibility.</p></div><div class="card"><h3>Ethics</h3><p>Do not treat “normal” as white and male: mention race, gender or ethnicity only when it is relevant.</p></div></div>`)
]});

const QB=[
{id:'l1',title:'Lecture 1 · Discussion & Debate',items:[
['Def','What is a discussion?','Talking about something with other people and telling them your ideas or opinions (Cambridge). In organizations it is used to choose the best way of handling an issue.'],
['Def','What is a debate?','An organized argument or contest of ideas in which participants discuss a topic from two opposing sides.'],
['Def','Who are the “Pro” and “Con” sides?','Pro agrees with the statement or idea; Con does not agree.'],
['Exp','How does each side work in a debate?','Each side shows in an organized, clever way why it has the right answers, using examples and evidence while working towards a conclusion.'],
['Cmp','Give five differences between discussion and debate.','Debate is formal, persuasive, competitive, ends with a winner and loser, and always has two opposing sides. Discussion is informal, not persuasive (shares facts, information, ideas), cooperative, has no accepted ending and has no opposing side.'],
['Exp','What is the purpose of a debate?','To persuade, convince or prove a point through logical arguments, evidence and rebuttals.'],
['Exp','What is the aim of a discussion?','To understand different perspectives, share ideas, or reach mutual understanding.'],
['App','“The scientists debated the findings” vs “The scientists discussed the findings.” What is the difference in tone?','“Discussed” suggests a less argumentative, more collaborative atmosphere.'],
['T/F','A debate does not lead to a conclusion.','False. A debate leads to a conclusion (winner and loser). It is a discussion that has no concrete conclusion.'],
['Exp','List six skills required for debating.','Logical and clear thinking, self-confidence, language skills (speaking, active listening), communication skills, time management, creativity.'],
['Exp','State five benefits of discussion and debate.','Better oral and written communication; critical thinking; research, organization and presentation tools; strategies to overcome fear of public speaking; confidence and desire to take part in all academic classes.'],
['Def','What is a dialogue?','A conversation between two or more people about a topic, in any setting; people freely express their ideas (General Dialogue).'],
['Exp','State eight rules of dialogue.','Listen carefully; think before speaking; be positive; one person speaks at a time; raise your hand; no interruption; criticize the idea, not the person; use “I” statements; be honest; respect others’ views; use open-ended questions; encourage everyone to participate.'],
['Exp','Why should we use “I” statements?','To avoid generalizing and to speak for ourselves only.'],
['Cmp','Direct vs indirect dialogue.','Direct: speakers’ exact words in quotation marks with a dialogue tag. Indirect: the conversation is summarized without direct quotations.'],
['Def','What is a dialogue tag?','A phrase such as “he asked” or “she said” that attributes a line of dialogue to a speaker.'],
['Exp','Why are non-standard tags (“she beamed”, “Wendy chimed”) discouraged?','They distract the reader by shifting attention from the dialogue to the tag.'],
['Exp','How is dialogue shown in a play?','Each line is preceded by the speaker’s name (e.g., ROMEO. / JULIET.).'],
['Exp','Why do novelists include dialogue?','It breaks the monotony of prose and keeps the reader interested.'],
['App','Identify the type: “He told her he was cheating her, and she replied angrily that she didn’t love him anymore.”','Indirect dialogue.']]},
{id:'l2',title:'Lecture 2 · Critical Thinking Basics',items:[
['Def','What is decision-making?','A thoughtful process of choosing among a variety of options for acting or thinking.'],
['Exp','Why does good decision-making depend on critical thinking?','Critical thinking breaks argumentation into its parts so its validity and strength can be evaluated; it entails effective communication, problem-solving and a commitment to overcome egocentrism and sociocentrism.'],
['Def','Define critical thinking.','The ability to think in an organized, rational way to understand connections between ideas or facts: “thinking about thinking”, i.e. identifying, analyzing, then fixing flaws in the way we think.'],
['Exp','List the seven critical thinking steps.','(1) Identify the problem or question; (2) gather data, opinions and arguments; (3) analyze and evaluate the data; (4) identify assumptions; (5) establish significance; (6) make a decision or reach a conclusion; (7) present or communicate.'],
['Exp','Describe four characteristics of a critical thinker.','Raises vital questions clearly and precisely; gathers and assesses relevant information and tests conclusions against standards; thinks open-mindedly, assessing assumptions and consequences; communicates effectively to solve complex problems.'],
['Def','Define argumentation, coercion, debate and ethics.','Argumentation: reason-giving to justify acts, beliefs, attitudes and values. Coercion: threat or use of force. Debate: inquiry and advocacy seeking a reasoned judgment on a proposition. Ethics: constructs that guide decisions by setting standards of behavior.'],
['Def','What are “good reasons”?','Reasons that are psychologically compelling for a given audience and make further inquiry unnecessary and redundant, justifying a decision to affirm or reject a proposition.'],
['Cmp','Persuasive communication vs propaganda.','Persuasion aims to influence acts, beliefs, attitudes and values. Propaganda is persuasion by a group in a sustained, organized, multi-media campaign aimed at a mass audience.'],
['Def','What is teleological ethics?','A result-oriented approach that judges an action by its good or bad consequences.'],
['Exp','Why study the history of critical thinking?','To see how far societies foster or hinder it; to give the concept life; to show it is part of human evolution and survival in an increasingly complex future.'],
['Exp','Who are the three most influential Greek philosophers, and where does critical thinking trace back to?','Socrates, Plato and Aristotle; its roots go back to Socrates.'],
['Exp','Discuss six reasons why critical thinking is significant.','It deals with change; improves language and presentation skills; promotes creativity; supports self-reflection; is the foundation of science; fosters independence.'],
['Exp','How does critical thinking promote creativity?','New ideas must also be useful and relevant; critical thinking evaluates, selects and modifies them.'],
['Exp','How does critical thinking foster independence?','Learners make sense of the world from experience and observation, make informed decisions, gain confidence and learn from mistakes.'],
['T/F','Critical thinking is only about finding faults in others’ arguments.','False. It also involves evaluating our own ideas and fixing flaws in our own thinking.']]},
{id:'l3',title:'Lecture 3 · Two Kinds of Reasoning',items:[
['Def','What is critical thinking (chapter definition)?','A way of deciding whether a claim is true, partially true or false; the evaluation of claims however we come up with them.'],
['Def','What is a claim?','A statement, something said or written to convey information or express an opinion or belief, that is either true or false.'],
['App','“Columbus is the most populous city in Ohio”: true or false?','True. “Columbus has the most populous metropolitan area in Ohio” is false (Cleveland’s is bigger).'],
['Exp','Give three kinds of claims that deserve close evaluation.','Important personal decisions (marrying), societal matters (universal health care), the nature of the world (supernatural events).'],
['Def','What is an issue?','A question raised whenever a claim is called into question: whether the claim is true or not. “Issue” and “question” can be used interchangeably.'],
['Def','What is an argument?','A reason given for thinking a claim is true; it has two parts, premise(s) and conclusion.'],
['Def','Define premise and conclusion.','Premise: a claim offered as a reason for believing another claim. Conclusion: the claim the premise is meant to support; it states a position on the issue.'],
['App','Sam says, “My grandmother died and I had to attend the funeral.” Identify issue, premise, conclusion.','Issue: should Sam be excused for missing class? Premise: his grandmother died and he attended the funeral. Conclusion: Sam should be excused.'],
['Def','What is a valid (deductive) argument?','One where it is impossible for the premises to be true and the conclusion false.'],
['App','Explain why “Josh lives in Alaska, therefore Josh lives in the United States” is valid.','It is impossible for him to live in Alaska and not in the US.'],
['Def','What is a good inductive argument?','One whose true premises raise the probability of the conclusion; it supports but does not prove it.'],
['App','Explain: “Fulcher lives in Alaska; therefore he uses mosquito repellent.”','Inductive: the premise makes the conclusion more probable, not certain.'],
['Def','Define deductive reasoning.','Reasoning that starts with a general statement or hypothesis and examines possibilities to reach a specific, logical conclusion.'],
['Exp','Name the four stages of the deductive research approach with the airline example.','(1) Existing theory: low-cost airlines always have delays; (2) hypothesis: passengers flying low-cost will always be delayed; (3) collect flight data; (4) analyze: 5 of 100 flights not delayed, so the hypothesis is rejected.'],
['Def','Define inductive reasoning.','Making broad generalizations from specific observations: observe many cases, discern a pattern, generalize, infer a theory.'],
['Exp','Name the three stages of the inductive approach.','Observation (one low-cost flight is delayed); pattern (20 more are delayed); theory (low-cost airlines always have delays).'],
['Exp','State the limitation of deduction.','Its conclusions are true only if all premises are true and the terms are clear.'],
['Exp','State the limitation of induction.','A conclusion can never be proven, but it can be invalidated.'],
['Cmp','Give two main differences between inductive and deductive reasoning.','Induction develops a theory; deduction tests an existing one. Induction moves from specific to general; deduction from general to specific.'],
['T/F','Inductive arguments prove their conclusions.','False. They only support them.'],
['App','“Butte City residents spend a lot of time in the sun; therefore a tanning salon won’t do well.” Type?','Inductive.']]},
{id:'l3p',title:'Lecture 3 · Inductive/Deductive Practice',items:[
['App','“All the swans I’ve seen are white; therefore all swans are white.”','Inductive: generalizes from observed cases.'],
['App','“All men are mortal. Socrates is a man. Therefore Socrates is mortal.”','Deductive: the conclusion must follow.'],
['App','“Several friends got a raise; therefore everyone at that company gets a raise.”','Inductive: a small sample stretched to a general claim.'],
['App','“All birds have feathers. A sparrow is a bird. Therefore a sparrow has feathers.”','Deductive: general rule applied to a case.'],
['App','“I’ve only met nice people in that city; therefore everyone there is nice.”','Inductive: hasty generalization from experience.'],
['App','“If it rains, the grass will be wet. It is raining. Therefore the grass is wet.”','Deductive: if–then rule applied.'],
['App','“The last few winters were very cold; therefore next winter will be cold.”','Inductive: a pattern projected forward.'],
['App','“Every cat I’ve owned was friendly; therefore all cats are friendly.”','Inductive: personal cases to all cats.'],
['App','“All squares are rectangles. This shape is a square. Therefore it is a rectangle.”','Deductive: category membership.'],
['App','“All humans need oxygen. Maria is human. Therefore Maria needs oxygen.”','Deductive: general rule applied.'],
['App','“Every time I eat strawberries my throat itches; therefore I’m allergic.”','Inductive: cause inferred from repeated observation.'],
['App','“No reptiles have fur. A snake is a reptile. Therefore a snake has no fur.”','Deductive: exclusion rule applied.'],
['App','“All roses are flowers. This is a rose. Therefore this is a flower.”','Deductive: category membership.'],
['App','“Students who study in groups tend to get better grades; therefore group study improves grades.”','Inductive: a pattern plus a causal leap.'],
['App','“All mammals have backbones. A dolphin is a mammal. Therefore a dolphin has a backbone.”','Deductive: general rule applied.'],
['Exp','Which words often signal induction?','“Tend to”, “every time I’ve seen”, “the last few”, “probably”: generalizing or predicting from observed cases.'],
['Exp','Why is “several friends got a raise” a weak basis for a general claim?','The sample is too small: a hasty generalization.'],
['Exp','Why is the group-study argument risky?','It moves from correlation to cause; better students may simply choose to study in groups.'],
['App','Write your own deductive and inductive argument about social media.','Model: All platforms with age limits must verify age; Platform X has an age limit; so X must verify age (deductive). Every teen I know sleeps late after using TikTok; so TikTok harms teen sleep (inductive).'],
['Cmp','Can a valid deductive argument with true premises have a false conclusion?','No.']]},
{id:'l5',title:'Lecture 5 · Clear Thinking & Fallacies',items:[
['Def','What is clear thinking?','The ability to express ideas simply and straightforwardly, and to analyze statements and follow logical arguments.'],
['Exp','Why is clear thinking essential?','All intelligent decision-making needs it; from exploring a problem to the final debate, we must guard against obstacles.'],
['Def','What is a fallacy?','Whately: any unsound mode of arguing which appears to demand our conviction and to be decisive of the question in hand, when in fairness it is not. A subtle, deceptive obstacle to clear thinking.'],
['Exp','Why are fallacies hard to spot in real arguments?','Easy to detect in isolation, but woven into the context of an argument they go unnoticed unless we are on guard.'],
['Exp','How does debate protect decision-makers against fallacies?','They can detect fallacies themselves, and opposing advocates are motivated to point them out.'],
['Exp','Are fallacies always deliberate?','No. Some are used deliberately (e.g., propaganda in an international crisis) and some accidentally by well-meaning people.'],
['Exp','Name the four types of fallacies.','Evidence, reasoning, language, pseudoarguments.'],
['Def','What is a fallacy of evidence?','An unsupported assertion presented as a complete argument, showing only the parts of the evidence that fit.'],
['App','A reviewer calls a musical dull and inept, but the ad quotes only “brilliantly executed … lavish costuming … flashes of inspiration.” Which fallacy?','Fallacy of evidence: selective quotation.'],
['Exp','Name four fallacies of reasoning.','Hasty generalization, analogy, cause, sign.'],
['Def','What is a hasty generalization?','A conclusion drawn from insufficient evidence, so it is unsound and unacceptable to decision-makers.'],
['Def','What is reasoning by analogy?','Comparing two similar cases and inferring that what is true in one is true in the other.'],
['App','Which question tests an analogy?','“Are there critical differences in the factors compared?” (The American showed differences between Russian and American government.)'],
['Def','What is causal reasoning?','Identifying the relationship between a cause and its effect (cause-to-effect or effect-to-cause); the cause must be complete, not partial.'],
['App','Weather-service example: which reasoning, and why only probable?','Causal: low-pressure areas (cause) predict rain (effect); we deal with probability because certainty cannot be established.'],
['Def','What is reasoning by sign?','Treating an observable sign as an indication of something else, e.g., the Babinski sign indicating disease of the corticospinal pathway.'],
['Exp','Name four fallacies of language.','Ambiguity, verbalism, loaded language, grammatical structure.'],
['Def','Define ambiguity, verbalism and loaded language.','Ambiguity: a word or passage can reasonably be read two or more ways. Verbalism: abundant words with little meaning. Loaded language: emotionally charged words used to establish a conclusion without proof.'],
['Def','What are pseudoarguments?','Fallacies created, by accident or design, by distortion, confusion, manipulation, avoidance of the issue, or substitution of irrelevant matters.'],
['Exp','List five pseudoargument fallacies.','Offering irrelevancy, arguing in a circle, ignoring the issue, repeating an assertion, structuring a response.'],
['App','“It’s true because it says so in the report, and the report is right because it’s true.” Which fallacy?','Arguing in a circle.']]},
{id:'l6',title:'Lecture 6 · Credibility: Claim and Source',items:[
['Def','What is credibility?','The capability of being believed; commanding belief in the truthfulness or correctness of what one says.'],
['Def','What is phishing?','A ploy that tricks victims into giving personal details (account and Social Security numbers) through fake e-mails and look-alike Web sites, for identity theft and credit card fraud.'],
['App','In Dave’s case, what made the fake Citibank site believable, and what should he have done?','It showed the bank’s logo and authentic-looking details. He should have given no credibility to an e-mail asking for personal identifying information via e-mail or a Web site.'],
['Exp','In which two arenas do we assess credibility?','The claim itself and the claim’s source.'],
['App','“Ducks communicate by quacking in Morse code” vs “Ducks mate for life.” Explain.','The first lacks initial plausibility whoever says it. The second is credible; belief depends on the source (a bird expert is more believable).'],
['Exp','Do sources have degrees of credibility?','Yes: sources vary just as claims do. The neighbor’s denial seems credible until it is found he owns a silencer and an untraceable .45.'],
['App','Why does a friend’s investment tip gain or lose credibility?','More credibility if he invested his own money; less if he earns a substantial commission.'],
['Def','Interested vs disinterested party.','Interested: stands to gain from our belief in a claim. Disinterested: has no stake either way.'],
['Exp','How should interested parties be treated?','With much more suspicion, though not all are out to hoodwink us and not all disinterested parties have good information.'],
['Exp','Give examples of irrelevant grounds people use to judge credibility.','Eye contact, perspiration, nervous laugh, height, loudness, assertiveness, gender, age, ethnicity, accent, mannerisms, clothes.'],
['Exp','Is occupation a good guide to credibility?','It relates to knowledge or ability, but is a less reliable guide to moral character or truthfulness.'],
['T/F','A taller, louder person is more credible.','False. These features merely tend to enhance perceived credibility; they are irrelevant.']]},
{id:'l7',title:'Lecture 7 · Assessing the Claim',items:[
['Exp','When do claims stand on their own, and when do they fail?','Some are acceptable regardless of source; they fail when they conflict with our own observations or our background knowledge.'],
['Exp','Why are personal observations our most reliable source?','They are our most direct information about the world, so a claim that conflicts with them is suspect.'],
['App','Moore has just seen Marquis’s red Mini Cooper; Parker says it is bright blue. What should Moore do, and why?','Reject the claim: it conflicts with his own observation; no special training is needed.'],
['Exp','List factors that can distort observations.','Tiredness, distraction, worry, emotional upset; bad lighting, noise, speed of events; inexact or faulty instruments.'],
['Exp','How do beliefs, hopes, fears and expectations affect observation?','They lead us to “see” what we expect: someone told a house has rats sees signs of rats; séance observers report phenomena that do not exist; teachers told a class is brighter rate its work higher.'],
['Exp','How do personal interests and biases affect perception?','We overlook faults of people we love and exaggerate those we detest; wishing a project to succeed or fail changes the evidence we notice; we draw worst-case implications from tasks we want to avoid.'],
['Exp','Why is memory a weakness in observation?','Our observations are only as reliable as our memories, which can deceive; critical thinkers remember that what they recall may not be what they observed.'],
['T/F','Firsthand observations are infallible.','False, but they remain the best source we have.'],
['Def','What is background information?','The large body of justified beliefs made of facts learned from direct observation and from others; we may not recall where we learned it.'],
['App','Why do we reject a wild claim we cannot directly disprove?','It conflicts with our well-confirmed background information.'],
['Def','What is initial plausibility?','A rough assessment of how credible a claim seems, based on how well it fits our background information.'],
['Exp','What do we do with claims of low initial plausibility?','Lean toward rejecting them unless very strong evidence supports them.'],
['Exp','Why does broad background information help?','It is hard to evaluate a report on a topic we know nothing about; e.g., economics helps judge deficit warnings, and knowing how Social Security works reveals why calling it a “savings account” is misleading.'],
['Exp','Summarize the key principles of credibility.','Claims lack credibility to the extent they conflict with observations, experience or background information, or come from non-credible sources; less plausible claims are more extraordinary; interested parties deserve more suspicion.'],
['Exp','Into what two categories do doubts about a source fall?','Doubts about knowledge or expertise, and doubts about veracity, objectivity and accuracy.'],
['Exp','How can we judge a person’s knowledge?','By education, experience, accomplishments, reputation and position.'],
['Exp','When are expert claims most reliable?','When they pertain to the area of expertise and do not conflict with claims of other experts in the same area.']]},
{id:'l8',title:'Lecture 8 · Persuasion Through Rhetoric',items:[
['Def','What is rhetoric?','The study of persuasive writing; a broad category of linguistic techniques used to influence beliefs, attitudes and behavior.'],
['Cmp','Rhetoric vs argument (logical vs psychological force).','An argument gives reasons (logical force); rhetoric moves us psychologically but by itself establishes nothing.'],
['App','“Still owes over $1,000” vs “owes only a little over $1,000.”','Same fact, different rhetorical force.'],
['App','“Freedom fighters” vs “dangerous terrorist organization.”','Different impressions created by rhetorical meaning, not different facts.'],
['Exp','Should we remove rhetoric from arguments or penalize it?','No. Do not deduct points for rhetoric and do not add points for it; screaming or devices do not make an argument stronger.'],
['Exp','List the groups of rhetorical devices.','Devices I–IV, proof surrogates and repetition, and persuasion using visual images.'],
['Def','Euphemism.','A neutral or positive expression used instead of one with negative associations (“pre-owned” for “used”; “neutralization” for assassination).'],
['Def','Dysphemism.','The opposite: used to produce a negative attitude or tone down positive associations (“terrorist” vs “freedom fighter”).'],
['Exp','Can euphemisms be legitimate?','Yes. Our purpose decides: they can prevent hostility halting discussion and be good manners (“passed on” for a recently widowed person).'],
['Def','Weaseler.','Linguistic hedging that waters down or removes what a claim asserts and gives the author a way out (“up to five more miles per gallon”).'],
['Def','Downplayer.','A device that makes someone or something look less important (“so-called doctor”, “just another liberal”).'],
['Exp','What are the three devices in Rhetorical Devices II and what do they rely on?','Stereotypes, innuendo, loaded questions; all rely on unwarranted assumptions.'],
['Def','Stereotype.','A generalization or assumption about all members of a group based on an image of the group (women are emotional, Americans are impatient); none could apply to all members.'],
['Def','Innuendo.','Manipulating conversational expectations and assumptions to hint at something without saying it.'],
['Def','Loaded question.','A question resting on an unwarranted assumption: “Have you stopped cheating on exams?”'],
['Exp','Why is “What time is it?” not loaded?','Its assumptions (listener speaks English, can find the time) are innocent and justified.'],
['Def','Ridicule / sarcasm (the horse laugh).','Ridicule and vicious humor of all kinds used to sway opinion (“They’re really on top of things”).'],
['Def','Hyperbole.','Extravagant overstatement (“I’m so hungry I could eat all the food here”).'],
['Exp','What are the two groups in Rhetorical Devices IV?','Rhetorical definitions and explanations; rhetorical analogies and misleading comparisons.'],
['Def','Proof surrogate.','An expression that suggests evidence or authority without citing it (“informed sources say”, “it’s obvious that”).'],
['Exp','Why should we question “informed sources say”?','Who are the sources, how do we know they are informed, and how does the speaker know?'],
['Def','Repetition.','Making the same point over and over to dull critical faculties; a main tool of propaganda, advertising and politics.'],
['Exp','What must a critical thinker remember about repetition?','Evidence and argument create believability; a claim unlikely on first hearing is no more likely on the hundredth.'],
['Exp','What is visual persuasion and what affects its power?','Using photos, illustrations and graphics to influence attitudes and behavior; power depends on visual content, graphic style and relationship to copy. Visuals and copy must form one message; a poor graphic can repulse viewers.'],
['App','Identify: (a) “Lose up to ten pounds a week” (b) “Don’t mind Mr. Pierce; he’s just another liberal” (c) “Experts agree it’s obvious.”','(a) Weaseler; (b) Downplayer/stereotype; (c) Proof surrogate.']]},
{id:'l9',title:'Lecture 9 · Argumentative Writing',items:[
['Def','What is an argumentative essay?','Writing that takes a stance on an issue and persuades the reader by presenting a strong argument supported by evidence, after thorough research and analysis of relevant sources.'],
['Exp','What are the four components of an argumentative essay?','Statement of the issue; statement of one’s position; arguments supporting it; rebuttals of arguments for contrary positions.'],
['Exp','How should the issue be introduced?','Show it is important or interesting, and state it fairly, not so the writer’s position looks like the only correct one, which makes the reader suspicious.'],
['Exp','How should position and arguments be stated?','Position clear and brief; arguments succinct but, above all, clear; reasons clearly relevant and either reliable or backed by further arguments.'],
['Exp','Name the four hints for planning an essay.','Focus; stick to the issue; arrange components in logical sequence; be complete.'],
['Exp','What does “Focus” mean, and what should be avoided?','State the issue and position at the outset in an engaging way; avoid the trite “In this essay I shall argue that X, Y, Z…” and its repeated summary.'],
['Exp','What does “Stick to the issue” require?','Every point must either support, illustrate, explain, clarify, elaborate or emphasize the position, or respond to an anticipated objection.'],
['Exp','What does a logical sequence mean?','Make a point before clarifying it; readers should move between sentences and paragraphs without confusion and be able to outline the essay easily.'],
['Exp','What does “Be complete” involve?','Accomplish what you set out to, support your position, anticipate objections; define the issue sharply (a narrower topic is easier to cover); closure at every level.'],
['Cmp','Is a conclusion the same as a summary?','No. Short essays need no summary.'],
['Exp','List the five good writing practices.','(1) After the first draft, identify issue and position and start by stating them; (2) revise: think of innumerable drafts; (3) have someone read and criticize it; (4) read aloud to catch grammar and punctuation errors; (5) set aside, then return for further revision.'],
['Exp','Name the five essay types to avoid.','The Windy Preamble; the Stream-of-Consciousness Ramble; the Knee-Jerk Reaction; the Glancing Blow; Let the Reader Do the Work.'],
['Def','Explain each of them briefly.','Windy Preamble: lengthy introductory remarks that avoid the issue. Ramble: unorganized thoughts in the order they arise. Knee-Jerk: first reaction with no depth. Glancing Blow: addresses the issue obliquely. Let the Reader Do the Work: non sequiturs, abrupt shifts, irrelevant sidetracks.'],
['Exp','Why avoid biased language about gender, ethnicity, religion or disability?','It is a matter of ethics but also clarity: careless wording is imprecise, may seem biased, hurts credibility and can distort the writer’s own view.'],
['App','Why is it problematic to mention a person’s race or gender only when they are not a white male?','It treats “normal” as white and male; mention such traits only if relevant.']]},
{id:'p1',title:'Project 1 · Kidfluencers',items:[

['Def','What are “kidfluencers”?','Children with large followings and verified profiles who earn brand endorsement deals (e.g., Walmart, Staples, Mattel), some too young to make their own accounts.'],

['Exp','Give three pros of kids being influencers.','Unique family experiences, skill-building, financial benefits.'],

['Exp','What age, if any, is appropriate, and who should decide?','Open opinion question: require reasons.'],
['App','Which persuasion devices might a brand use through a child influencer?','Proof surrogates, repetition, visual images, euphemism, emotional appeals.'],

/* ================= PRACTICE ================= */
const gtQ=g=>UI==='ar'?GAR.q[g.id]:g.title, gtW=g=>UI==='ar'?GAR.w[g.id]:g.title;
const PR={tool:'oral',g:'all',hard:false,dir:'en',wmark:false,secs:60,count:10};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const qAll=()=>QB.flatMap(g=>g.items.map((it,i)=>({id:g.id+':'+i,g:g.id,tag:it[0],q:it[1],a:it[2],lec:gtQ(g)})));
const wAll=()=>WB.flatMap(g=>g.items.map((it,i)=>({id:g.id+':'+i,g:g.id,en:it[0],ar:it[1],de:it[2],da:it[3],lec:gtW(g)})));
const qPool=()=>qAll().filter(x=>(PR.g==='all'||x.g===PR.g)&&(!PR.hard||SV.hq[x.id]));
const wPool=()=>wAll().filter(x=>(PR.g==='all'||x.g===PR.g)&&(!PR.wmark||SV.hw[x.id]));
let tim=null;const stopTim=()=>{if(tim){clearInterval(tim);tim=null;}};
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const empty=()=>`<div class="empty">${L('No items match this scope. Choose another lecture or switch off the marked-only option.','لا توجد عناصر ضمن هذا النطاق. اختر محاضرة أخرى أو أوقف خيار «المُعلَّم فقط».')}</div>`;

function viewP(){
  stopTim();
  const tools=[['oral','Oral exam','امتحان شفهي','timer'],['self','Self-test','اختبار ذاتي','quiz'],['cards','Flashcards','بطاقات المفردات','words'],['debate','Debate builder','منشئ المناظرة','slides']];
  const scope=PR.tool==='cards'?WB:PR.tool==='debate'?[]:QB;
  const tot=scope.reduce((n,g)=>n+g.items.length,0);
  const titleOf=g=>PR.tool==='cards'?(UI==='ar'?GAR.w[g.id]:short(g.title)):(UI==='ar'?GAR.q[g.id]:short(g.title));
  const lecs=[['all',L('All lectures','كل المحاضرات'),tot]].concat(scope.map(g=>[g.id,titleOf(g),g.items.length]));
  const seg=(id,arr,cur)=>`<div class="seg" id="${id}" role="group">${arr.map(a=>`<button data-v="${a[0]}" aria-pressed="${String(cur)===String(a[0])}">${a[1]}</button>`).join('')}</div>`;
  const sw=(id,on,label)=>`<span class="tog"><button class="switch sm" role="switch" aria-checked="${on}" id="${id}" aria-label="${label}"><i></i></button>${label}</span>`;
  let opts='';
  if(PR.tool==='oral')opts=`<p class="fh">${L('Time per question','الوقت لكل سؤال')}</p>${seg('psecs',[[30,'30s'],[60,'60s'],[90,'90s'],[120,'120s']],PR.secs)}${sw('phard',PR.hard,L('Marked questions only','الأسئلة المُعلَّمة فقط'))}`;
  if(PR.tool==='self')opts=`<p class="fh">${L('Questions in the test','عدد الأسئلة')}</p>${seg('pcount',[[5,'5'],[10,'10'],[20,'20']],PR.count)}${sw('phard',PR.hard,L('Marked questions only','الأسئلة المُعلَّمة فقط'))}`;
  if(PR.tool==='cards')opts=`<p class="fh">${L('Card front','وجه البطاقة')}</p>${seg('pdir',[['en','English → ع'],['ar','ع → English']],PR.dir)}${sw('pmark',PR.wmark,L('Marked words only','المفردات المُعلَّمة فقط'))}`;
  const nq=Object.keys(SV.hq).length,nw=Object.keys(SV.hw).length;
  const marks=PR.tool==='cards'?nw:nq;
  app.innerHTML=`<div class="bankwrap">${sideHTML(`<p class="fh">${L('Tool','الأداة')}</p><div class="fl" id="ptool">${tools.map(t=>`<button class="fb" data-t="${t[0]}" aria-pressed="${PR.tool===t[0]}"><span>${L(t[1],t[2])}</span></button>`).join('')}</div>${opts}${scope.length?`<p class="fh">${L('Scope','النطاق')}</p><div class="fl" id="pg">${lecs.map(c=>`<button class="fb" data-g="${c[0]}" aria-pressed="${PR.g===c[0]}"><span>${c[1]}</span><b>${c[2]}</b></button>`).join('')}</div>`:''}${PR.tool!=='debate'?`<p class="note" id="pmarks">${L('Marked for review','مُعلَّم للمراجعة')}: <b>${marks}</b></p><button class="reset" id="pclear">${L('Clear marks','مسح العلامات')}</button>`:''}`)}<section class="fmain bank" id="pmain"></section></div>`;
  wireToggle();
  $$('#ptool .fb').forEach(b=>b.onclick=()=>{PR.tool=b.dataset.t;PR.g='all';PR.hard=false;PR.wmark=false;OR.q=null;ST.run=false;viewP();});
  $$('#pg .fb').forEach(b=>b.onclick=()=>{PR.g=b.dataset.g;viewP();});
  const sg=(id,fn)=>{$$('#'+id+' button').forEach(b=>b.onclick=()=>{fn(b.dataset.v);viewP();});};
  sg('psecs',v=>{PR.secs=+v;OR.q=null;});sg('pcount',v=>{PR.count=+v;ST.run=false;});sg('pdir',v=>{PR.dir=v;});
  const ph=$('#phard');if(ph)ph.onclick=()=>{PR.hard=!PR.hard;OR.q=null;ST.run=false;viewP();};
  const pm=$('#pmark');if(pm)pm.onclick=()=>{PR.wmark=!PR.wmark;viewP();};
  const pc=$('#pclear');if(pc)pc.onclick=()=>{if(PR.tool==='cards')SV.hw={};else SV.hq={};save();viewP();};
  drawP();}
const updMarks=()=>{const e=$('#pmarks b');if(e)e.textContent=Object.keys(PR.tool==='cards'?SV.hw:SV.hq).length;};
function drawP(){({oral:oralView,self:selfView,cards:cardsView,debate:debateView})[PR.tool]();}

/* ---------- oral exam ---------- */
const OR={q:null,left:0,queue:[],rev:false};
function oralView(){$('#pmain').innerHTML=`<h1>${L('Oral exam practice','تدريب على الامتحان الشفهي')}</h1><p class="lede">${L('Draw a question, answer out loud before the clock runs out, then reveal the model answer and rate yourself.','اسحب سؤالاً، وأجب بصوت مسموع قبل انتهاء الوقت، ثم اعرض الإجابة النموذجية وقيّم نفسك.')}</p><div id="ocard"></div>`;
  if(OR.q)paintOral();else startOral();}
function startOral(){$('#ocard').innerHTML=`<button class="btn big-btn" id="odraw">${ico('shuffle',26)} ${L('Draw a question','اسحب سؤالاً')}</button><p class="note" style="margin-top:14px">${L('Questions available','الأسئلة المتاحة')}: <b>${qPool().length}</b></p>`;$('#odraw').onclick=drawOral;}
function drawOral(){const pool=qPool();if(!pool.length){$('#ocard').innerHTML=empty();return;}
  OR.queue=OR.queue.filter(id=>pool.some(p=>p.id===id));if(!OR.queue.length)OR.queue=shuf(pool.map(p=>p.id));
  const id=OR.queue.pop();OR.q=pool.find(p=>p.id===id);OR.left=PR.secs;OR.rev=false;paintOral();}
function paintOral(){const q=OR.q;stopTim();
  $('#ocard').innerHTML=`<div class="ocard"><div class="otop"><span class="tag">${tagLabel(q.tag)}</span><span class="note">${q.lec}</span><span class="clock" id="clock">${fmt(OR.left)}</span></div><div class="tbar"><i id="tfill" style="width:${OR.left/PR.secs*100}%"></i></div><p class="oq">${q.q}</p>
  <div class="oact" id="oa1"${OR.rev?' hidden':''}><button class="btn" id="orev">${L('Reveal answer','اعرض الإجابة')}</button><button class="btn alt" id="oskip">${L('Skip','تخطَّ')}</button></div>
  <div class="model" id="omodel"${OR.rev?'':' hidden'}><b>${L('Model answer','الإجابة النموذجية')}</b><br>${q.a}</div>
  <div class="oact" id="orate"${OR.rev?'':' hidden'}><button class="btn" data-r="1">${ico('check',22)} ${L('Got it','أتقنتها')}</button><button class="btn alt" data-r="0">${ico('star',22)} ${L('Needs work','تحتاج مراجعة')}</button></div></div>`;
  $('#orev').onclick=()=>{OR.rev=true;stopTim();$('#oa1').hidden=true;$('#omodel').hidden=false;$('#orate').hidden=false;};
  $('#oskip').onclick=drawOral;
  $$('#orate [data-r]').forEach(b=>b.onclick=()=>{if(b.dataset.r==='1')delete SV.hq[q.id];else SV.hq[q.id]=1;save();updMarks();drawOral();});
  if(!OR.rev&&OR.left>0){tim=setInterval(()=>{OR.left--;const c=$('#clock');if(!c){stopTim();return;}
    $('#tfill').style.width=Math.max(0,OR.left/PR.secs*100)+'%';
